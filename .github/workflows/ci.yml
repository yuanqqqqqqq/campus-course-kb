# 持续集成：代码质量 + 测试
#
# 目标：**任何一次 push / PR 都不能把坏代码合进主干**。
# 三个 job 刻意分开，失败时一眼能看出是哪一类问题：
#   lint  —— 静态检查（ruff）
#   test  —— 单元 + 集成测试（pytest，Python 3.11 / 3.12 双版本）
#   corpus —— 语料能不能解析（建库脚本的试运行）
#
# 不调用真实 DeepSeek：整套测试用假 LLM，所以**不需要配置任何密钥**。
# 需要真实模型文件的用例（tests/unit/test_embeddings.py）在 CI 里会自动跳过。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 也允许手动触发

# 同一分支的新 push 取消上一次未跑完的任务，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ruff 是纯 Python 工具，单独装比装整个 requirements 快得多
      - name: Install ruff
        run: pip install "ruff==0.16.10"

      - name: ruff check
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # requirements.txt 精确锁了版本，pip 缓存能显著缩短安装时间
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python --version
          pip list --format=columns | head -40

      # 语料解析失败会让整个 RAG 失效，而单测用的是临时语料、测不到真语料。
      # 所以这里单独跑一次真实语料的试运行（不写向量库、不联网）。
      - name: Validate corpus (dry run)
        run: python scripts/ingest.py --dry-run

      - name: Run tests
        # 覆盖率只作为报告输出（不设阈值门禁）：本项目靠 599 条用例与
        # 评测脚本共同保证质量，用覆盖率红线卡 CI 只会诱发"为凑数字写测试"。
        run: pytest -q --color=yes --cov=src --cov-report=term-missing

      # 测试失败时把报告传上去，方便在 Actions 页面直接看
      - name: Upload pytest summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: .pytest_cache/v/cache/lastfailed
          if-no-files-found: ignore
